<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF0000" />
    <meta
      name="description"
      content="Thiago Auto Spare — management system"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Cover page while Swahili applies so Google spinner never flashes -->
    <script>
      (function () {
        try {
          var path = location.pathname || "";
          var section =
            path.indexOf("/admin") === 0
              ? "admin"
              : path.indexOf("/boma") === 0
              ? "boma"
              : path.indexOf("/geita") === 0
              ? "geita"
              : "";
          var key = section ? "appLanguage_" + section : "appLanguage";
          if (localStorage.getItem(key) === "sw") {
            document.documentElement.classList.add("thiago-lang-settling");
          }
        } catch (e) {}
      })();
    </script>
    <style id="thiago-hide-gt">
      /* Silent Google Translate chrome */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      .goog-te-balloon-frame,
      #goog-gt-tt,
      .goog-te-spinner-pos,
      .goog-te-spinner-animation,
      .goog-te-spinner,
      .VIpgJd-ZVi9od-ORHb,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      .VIpgJd-ZVi9od-l4eHX-hSRGPd,
      body > .skiptranslate:not(#google_translate_element) {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        max-height: 0 !important;
        width: 0 !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: absolute !important;
        left: -9999px !important;
        z-index: -1 !important;
      }
      html { margin-top: 0 !important; }
      body { top: 0 !important; position: static !important; }
      #google_translate_element {
        position: absolute !important;
        left: -9999px !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
        opacity: 0 !important;
      }

      /* Stable Swahili boot: solid cover until translation finishes */
      html.thiago-lang-settling body {
        overflow: hidden !important;
      }
      html.thiago-lang-settling #root {
        opacity: 0 !important;
        pointer-events: none !important;
      }
      html.thiago-lang-settling::before {
        content: "";
        position: fixed;
        inset: 0;
        background: #562731;
        z-index: 2147483646;
        pointer-events: none;
      }
    </style>
    <title>Thiago Auto Spare</title>
    <script>
      // Default to light theme before React boots
      (function () {
        try {
          var path = location.pathname || "";
          var section =
            path.indexOf("/admin") === 0
              ? "admin"
              : path.indexOf("/boma") === 0
              ? "boma"
              : path.indexOf("/geita") === 0
              ? "geita"
              : "";
          var key = section ? "systemTheme_" + section : "systemTheme";
          var saved = localStorage.getItem(key);
          if (saved === "dark") {
            document.documentElement.classList.add("dark-theme");
          } else {
            document.documentElement.classList.remove("dark-theme");
          }
        } catch (e) {
          document.documentElement.classList.remove("dark-theme");
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
